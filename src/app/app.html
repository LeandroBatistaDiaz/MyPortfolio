<a class="skip-link" href="#main-content">{{ language.t('Saltar al contenido') }}</a>

<header class="topbar" [class.topbar--story]="isStoryMode()">
  <a class="brand" routerLink="/" [attr.aria-label]="language.t('Ir al inicio')">
    <span class="brand__mark">LB</span>
    <span class="brand__text">
      <strong>Leandro Batista</strong>
      <small>{{ language.t('Software Engineer') }}</small>
    </span>
  </a>

  <nav class="desktop-nav" aria-label="Navegación principal">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="goToProjects($event)">
      <svg lucideFolderKanban [size]="18"></svg>
      {{ language.t('Proyectos') }}
    </a>
    <a routerLink="/about" routerLinkActive="is-active" (click)="goToProfile($event)">
      <svg lucideUserRound [size]="18"></svg>
      {{ language.t('Perfil') }}
    </a>
  </nav>

  <div class="topbar__actions">
    <button
      class="language-toggle"
      type="button"
      [attr.aria-label]="language.language() === 'es' ? 'Switch to English' : 'Cambiar a español'"
      [attr.title]="language.language() === 'es' ? 'Switch to English' : 'Cambiar a español'"
      (click)="language.toggle()"
    >
      {{ language.language() === 'es' ? 'EN' : 'ES' }}
    </button>
    <button
      class="theme-toggle"
      type="button"
      [attr.aria-label]="language.t(theme() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro')"
      [attr.title]="language.t(theme() === 'dark' ? 'Modo claro' : 'Modo oscuro')"
      (click)="toggleTheme()"
    >
      @if (theme() === 'dark') {
        <svg lucideSun [size]="17"></svg>
        <span class="theme-toggle__label">{{ language.t('Claro') }}</span>
      } @else {
        <svg lucideMoon [size]="17"></svg>
        <span class="theme-toggle__label">{{ language.t('Oscuro') }}</span>
      }
    </button>
    <a class="topbar__cta" routerLink="/contact">
      {{ language.t('Hablemos') }}
      <svg lucideArrowUpRight [size]="18"></svg>
    </a>
  </div>
</header>

<main id="main-content" [class.story-route]="isStoryMode()">
  <router-outlet />
</main>

@if (!isStoryMode()) {
  <nav class="mobile-nav" aria-label="Navegación móvil">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" (click)="goToProjects($event)">
      <svg lucideFolderKanban [size]="21"></svg>
      <span>{{ language.t('Proyectos') }}</span>
    </a>
    <a routerLink="/about" routerLinkActive="is-active" (click)="goToProfile($event)">
      <svg lucideUserRound [size]="21"></svg>
      <span>{{ language.t('Perfil') }}</span>
    </a>
    <a routerLink="/contact" routerLinkActive="is-active">
      <svg lucideMail [size]="21"></svg>
      <span>{{ language.t('Contacto') }}</span>
    </a>
  </nav>
}
